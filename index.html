<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvadrat animatsiyasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="animation">
        <h1>Kvadrat harakati</h1>
        <div class="stage" aria-label="To‘rtta nuqtali harakat maydoni">
            <span class="point point-1">1</span>
            <span class="point point-2">2</span>
            <span class="point point-3">3</span>
            <span class="point point-4">4</span>
            <div class="box" aria-label="Harakatlanuvchi kvadrat"></div>
        </div>
        <button class="start-button" type="button">Harakatni boshlash</button>
        <p class="status" aria-live="polite">Boshlash uchun tugmani bosing.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
